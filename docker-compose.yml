services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env.production
    volumes:
      - ./backend/config:/usr/src/app/config:ro
      - ./backend/logs:/usr/src/app/logs
      - ./.env.production:/usr/src/app/.env:ro
    networks:
      - app-network
    restart: on-failure:5

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt/options-ssl-nginx.conf:/etc/letsencrypt/options-ssl-nginx.conf:ro
    networks:
      - app-network
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_URI: ${MONGO_URI}
    volumes:
      - mongo-data:/data/db
      - ./mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh \"$MONGO_URI\" --quiet --eval \"db.runCommand({ ping: 1 }).ok\" | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis-cache:
    image: eqalpha/keydb:latest
    command: ["keydb-server", "/etc/keydb/keydb.conf"]
    volumes:
      - redis-cache-data:/data
      - ./keydb/keydb-cache.conf:/etc/keydb/keydb.conf:ro
    networks:
      - app-network
    restart: unless-stopped

  redis-queue:
    image: eqalpha/keydb:latest
    command: ["keydb-server", "/etc/keydb/keydb.conf", "--port", "6380"]
    volumes:
      - redis-queue-data:/data
      - ./keydb/keydb-queue.conf:/etc/keydb/keydb.conf:ro
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
  redis-cache-data:
  redis-queue-data:
